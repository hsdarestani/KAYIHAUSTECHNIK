name: Validate reference transfer

on:
  push:
    branches:
      - feature/kayi-reference-data-final

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect transferred chunks
        run: |
          set -eu
          find reference_data/encrypted -maxdepth 1 -type f -name 'payload.part-*' -print0 | sort -z | xargs -0 -r sha256sum
          find reference_data/encrypted -maxdepth 1 -type f -name 'payload.part-*' -printf '%f %s\n' | sort
