name: Inspect current assembled source

on:
  push:
    branches:
      - fix/wizard-live-prices-customer-import

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble application source
        run: bash scripts/unpack-source.sh
      - name: Pack relevant assembled source
        run: |
          tar -czf /tmp/kayi-current-source.tgz erp templates tests static config requirements.txt manage.py
      - uses: actions/upload-artifact@v4
        with:
          name: kayi-current-source
          path: /tmp/kayi-current-source.tgz
          if-no-files-found: error
          retention-days: 1
