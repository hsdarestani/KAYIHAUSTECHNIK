name: Diagnose AI and photo upload

on:
  push:
    branches:
      - fix/ai-photo-production-20260807

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect production AI model and upload failure
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -eu
            cd /opt/kayi
            if docker compose version >/dev/null 2>&1; then DC='docker compose'; else DC='docker-compose'; fi
            echo '=== configured model ==='
            grep '^OPENAI_MODEL=' .env 2>/dev/null || true
            echo '=== actual model call tests ==='
            ($DC exec -T web python manage.py shell -c "from erp.services.ai import get_client; r=get_client().responses.create(model='gpt-4.1-mini',input='Reply with exactly OK',store=False,max_output_tokens=8); print('MODEL_TEST gpt-4.1-mini OK',repr(r.output_text))") || true
            ($DC exec -T web python manage.py shell -c "from erp.services.ai import get_client; r=get_client().responses.create(model='gpt-4.1',input='Reply with exactly OK',store=False,max_output_tokens=8); print('MODEL_TEST gpt-4.1 OK',repr(r.output_text))") || true
            ($DC exec -T web python manage.py shell -c "from erp.services.ai import get_client; r=get_client().responses.create(model='gpt-4o-mini',input='Reply with exactly OK',store=False,max_output_tokens=8); print('MODEL_TEST gpt-4o-mini OK',repr(r.output_text))") || true
            ($DC exec -T web python manage.py shell -c "from erp.services.ai import get_client; r=get_client().responses.create(model='gpt-5-mini',input='Reply with exactly OK',store=False,max_output_tokens=8); print('MODEL_TEST gpt-5-mini OK',repr(r.output_text))") || true
            echo '=== Caddyfile ==='
            ($DC exec -T caddy sh -c 'cat /etc/caddy/Caddyfile' || true)
            echo '=== relevant web logs around photo failure ==='
            ($DC logs --since '2026-08-07T11:55:00Z' --until '2026-08-07T12:10:00Z' web 2>&1 | grep -Ei 'measurements/analyze|RequestDataTooBig|413|403|502|Traceback|CSRF|Bad Request|Too Large' | tail -150 || true)
            echo '=== relevant caddy logs around photo failure ==='
            ($DC logs --since '2026-08-07T11:55:00Z' --until '2026-08-07T12:10:00Z' caddy 2>&1 | grep -Ei 'measurements/analyze|413|403|502|error' | tail -150 || true)
