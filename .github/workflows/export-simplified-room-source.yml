name: Export simplified room source

on:
  push:
    branches: [feature/simplified-room-scan-editor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Assemble application source
        run: bash scripts/unpack-source.sh
      - name: Create source archive
        run: tar -czf /tmp/kayi-simplified-room-source.tar.gz --exclude-vcs .
      - uses: actions/upload-artifact@v4
        with:
          name: kayi-simplified-room-source-${{ github.run_id }}
          path: /tmp/kayi-simplified-room-source.tar.gz
          retention-days: 2
