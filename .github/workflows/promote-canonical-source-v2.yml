name: Promote canonical source v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  promote:
    if: ${{ github.event.pull_request.user.login == 'hsdarestani' && github.event.pull_request.title == '[canonical-promote-v2] KAYI source' && github.event.pull_request.base.ref == 'main' && github.head_ref == 'perf/canonical-source-fast-path-v2-20260908' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Materialize exact production source
        run: |
          bash scripts/unpack-source.sh
          python3 scripts/final_production_hardening_20260821.py
          python3 scripts/tooltime_user_settings_import.py
          python3 scripts/mobile_invoice_menu_fix.py
      - name: Verify production materialization
        run: |
          test -f manage.py
          test -f erp/models.py
          test -f templates/rebuild/base.html
          test -f scripts/production_browser_smoke.py
          test -d native
          test -d mobile
          grep -q '<th>Artikelnummer</th>' templates/rebuild/catalogue.html
          python3 -m compileall -q erp config scripts/production_browser_smoke.py
      - name: Commit canonical source without workflow mutations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout HEAD -- .github/workflows
          git clean -fd .github/workflows
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Materialize current production source as canonical'
          git push origin HEAD:${{ github.head_ref }}
