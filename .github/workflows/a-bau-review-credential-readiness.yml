name: A+Bau review credential readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-bau-review-credential-readiness.yml'

permissions:
  contents: read

jobs:
  verify-review-login:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Require stable reviewer password
        env:
          REVIEW_PASS: ${{ secrets.KAYI_REVIEW_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$REVIEW_PASS" || { echo 'KAYI_REVIEW_PASSWORD is missing.' >&2; exit 2; }
          echo "::add-mask::$REVIEW_PASS"
          echo 'Stable reviewer password found; username is fixed to demo.'

      - name: Verify production reviewer authentication
        uses: appleboy/ssh-action@v1.2.5
        env:
          REVIEW_USER: demo
          REVIEW_PASS: ${{ secrets.KAYI_REVIEW_PASSWORD }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASS }}
          envs: REVIEW_USER,REVIEW_PASS
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/kayi
            if docker compose version >/dev/null 2>&1; then DC='docker compose'; else DC='docker-compose'; fi
            $DC exec -T \
              -e REVIEW_USER="$REVIEW_USER" \
              -e REVIEW_PASS="$REVIEW_PASS" \
              web python manage.py shell -c "
            import os
            from django.contrib.auth import authenticate, get_user_model

            username = os.environ['REVIEW_USER']
            password = os.environ['REVIEW_PASS']
            user = get_user_model().objects.filter(username=username).first()
            assert user is not None, 'Store review account missing'
            assert user.is_active, 'Store review account inactive'
            assert user.check_password(password), 'Store review password does not match production'
            assert authenticate(username=username, password=password) is not None, 'Store review authentication failed'
            print('A+Bau reviewer login is READY for Store review.')
            "
