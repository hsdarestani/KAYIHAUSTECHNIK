name: Verify KAYI production data

on:
  push:
    branches:
      - maintenance/verify-kayi-production

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify production over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -eu
            cd /opt/kayi
            echo '=== COMMIT ==='
            git rev-parse HEAD
            echo '=== REFERENCE KEY ==='
            test -s /opt/kayi-secrets/reference-private.pem
            key_fingerprint="$(openssl pkey -in /opt/kayi-secrets/reference-private.pem -pubout -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
            echo "reference_public_key_der_sha256=${key_fingerprint}"
            test "$key_fingerprint" = "cd1ce6b1ca51d079b417b42e96d582c70363bef0ba42cc1e408ffc64ba225b03"
            echo '=== CONTAINERS ==='
            docker compose ps
            echo '=== REFERENCE FILES ==='
            find /opt/kayi-reference-data -maxdepth 6 -type f -printf '%P\t%s bytes\n' 2>/dev/null | sort | head -300 || true
            echo "reference_file_count=$(find /opt/kayi-reference-data -type f 2>/dev/null | wc -l)"
            echo '=== APPLICATION DATA ==='
            docker compose exec -T web python manage.py shell -c "
            from django.apps import apps
            from django.contrib.auth import get_user_model
            Organization = apps.get_model('erp', 'Organization')
            CalendarEvent = apps.get_model('erp', 'CalendarEvent')
            Project = apps.get_model('erp', 'Project')
            CatalogItem = apps.get_model('erp', 'CatalogItem')
            real = Organization.objects.exclude(settings__is_demo=True).first()
            demo = Organization.objects.filter(settings__is_demo=True).first()
            print('models=', sorted(model.__name__ for model in apps.get_app_config('erp').get_models()))
            print('real_org=', real.name if real else None)
            print('demo_org=', demo.name if demo else None)
            print('catalog_items=', CatalogItem.objects.filter(organization=real).count() if real else 0)
            print('demo_events=', CalendarEvent.objects.filter(organization=demo).count() if demo else 0)
            print('demo_projects=', Project.objects.filter(organization=demo).count() if demo else 0)
            print('demo_user=', get_user_model().objects.filter(username='demo').exists())
            PriceSource = next((m for m in apps.get_app_config('erp').get_models() if m.__name__ == 'PriceSource'), None)
            PriceItem = next((m for m in apps.get_app_config('erp').get_models() if m.__name__ == 'PriceItem'), None)
            print('price_sources=', PriceSource.objects.filter(organization=real).count() if PriceSource and real else 0)
            print('price_items=', PriceItem.objects.filter(organization=real).count() if PriceItem and real else 0)
            "
            echo '=== INTERNAL HEALTH ==='
            curl -fsS http://127.0.0.1/api/health/
      - name: Verify public HTTPS health
        run: curl --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 8 --max-time 20 -fsS https://kayi.smarbiz.sbs/api/health/
