name: Export current assembled source

on:
  push:
    branches: [maintenance/source-export]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Assemble source
        run: bash scripts/unpack-source.sh
      - name: Package source
        run: |
          tar -czf /tmp/kayi-current-source.tar.gz \
            config erp templates static tests manage.py requirements.txt \
            Dockerfile .env.example
      - uses: actions/upload-artifact@v4
        with:
          name: kayi-current-source-${{ github.run_id }}
          path: /tmp/kayi-current-source.tar.gz
          if-no-files-found: error
          retention-days: 1
