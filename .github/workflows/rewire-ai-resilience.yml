name: Rewire AI resilience patch

on:
  push:
    branches:
      - fix/ai-photo-production-20260807

permissions:
  contents: write

jobs:
  rewire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ai-photo-production-20260807
          fetch-depth: 0
      - name: Move patch after feature patches and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('scripts/source_overrides.py')
          text = source.read_text(encoding='utf-8')
          old_block = '''apply_verified_patch(
              "scripts/ai_provider_resilience_patch",
              "67763375707daa486b66c6934a02ac30476ff109686d52adb453bf69d11dc1cb",
              "kayi-ai-provider-resilience.patch",
              "KAYI AI provider resilience",
          )

          '''
          if old_block in text:
              text = text.replace(old_block, '', 1)
              source.write_text(text, encoding='utf-8')

          cache = Path('scripts/cache_bust_overrides.py')
          text = cache.read_text(encoding='utf-8')
          text = text.replace('VERSION = "20260807-1245"', 'VERSION = "20260807-1600"')
          text = text.replace('CACHE_NAME = "kayi-shell-v14-20260807"', 'CACHE_NAME = "kayi-shell-v15-20260807"')
          marker = 'scripts/ai_provider_resilience_patch'
          if marker not in text:
              anchor = '''apply_verified_patch(
              "scripts/wizard_live_prices_customer_import_patch",
              "24fddb1c5baad12e9d41a9d7b037e8d7f943d384fda57a015e7cbe9ac63d9245",
              "kayi-wizard-live-prices-customer-import.patch",
              "KAYI wizard live prices and customer import",
          )
          '''
              block = '''
          # Keep every AI surface operational when a configured model requires
          # account verification, and make frontend failures proxy-safe.
          apply_verified_patch(
              "scripts/ai_provider_resilience_patch",
              "1d09e3ee28a843282f642561bab3641a760a372f5f939e0dc2e902b01813e57e",
              "kayi-ai-provider-resilience.patch",
              "KAYI AI provider resilience",
          )
          '''
              if anchor not in text:
                  raise SystemExit('cache-bust patch anchor not found')
              text = text.replace(anchor, anchor + block, 1)
          cache.write_text(text, encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'KAYI CI'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/source_overrides.py scripts/cache_bust_overrides.py
          git commit -m 'Apply AI resilience after final feature patches'
          git push origin HEAD:fix/ai-photo-production-20260807
