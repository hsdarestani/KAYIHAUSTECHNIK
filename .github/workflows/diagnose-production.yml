name: Diagnose KAYI production host

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.event.pull_request.user.login == 'hsdarestani' && github.event.pull_request.title == '[diagnose] KAYI production' && github.event.pull_request.base.ref == 'main' && github.head_ref == 'maintenance/kayi-production-diagnose' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect production host
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 5m
          script: |
            set +e
            cd /opt/kayi 2>/dev/null || exit 0
            if docker compose version >/dev/null 2>&1; then
              DC='docker compose'
            else
              DC='docker-compose'
            fi

            echo '=== release head ==='
            git rev-parse HEAD
            git status --short

            echo '=== database release assertions ==='
            $DC run --rm web python manage.py shell -c "
            from erp.models import CalendarEvent, CatalogItem, Organization, PriceItem, PriceSource
            real = Organization.objects.filter(name='KAYI Haustechnik').first()
            demo = Organization.objects.filter(settings__is_demo=True).first()
            print('real_org=', bool(real))
            print('demo_org=', bool(demo))
            print('sources=', PriceSource.objects.filter(organization=real).count() if real else -1)
            print('prices=', PriceItem.objects.filter(organization=real).count() if real else -1)
            print('catalog=', CatalogItem.objects.filter(organization=real).count() if real else -1)
            print('demo_calendar=', CalendarEvent.objects.filter(organization=demo).count() if demo else -1)
            "

            echo '=== deployed direct B&O search ==='
            $DC run --rm web python manage.py shell -c "
            from erp.models import Organization
            from erp.services.bo_direct_search import search_bo_prices, serialize_bo_price
            org = Organization.objects.get(name='KAYI Haustechnik')
            for query in ('Duscharmatur', 'Dichtheitsprüfung', 'Ausgleich', 'Nivellier', 'VA04'):
                rows = search_bo_prices(org, query, limit=5)
                print('QUERY', query, 'COUNT', len(rows))
                for row in rows[:5]:
                    item = serialize_bo_price(row)
                    print('RESULT', query, item['code'], item['price'], item['unit'], item['description'][:140], item['source'])
            "

            echo '=== containers and health ==='
            $DC ps -a
            curl -sS -o /dev/null -w 'local_health_http=%{http_code}\n' http://127.0.0.1/api/health/
            curl -sS -o /dev/null -w 'domain_health_http=%{http_code}\n' --connect-timeout 5 https://kayi.smarbiz.sbs/api/health/

            echo 'diagnostic_sync=bo-direct-search-1'
