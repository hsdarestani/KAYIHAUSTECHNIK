name: A+Bau review account state

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-bau-review-account-state.yml'

permissions:
  contents: read

jobs:
  inspect-production-reviewer:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Inspect reviewer account without exposing credentials
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASS }}
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/kayi
            if docker compose version >/dev/null 2>&1; then DC='docker compose'; else DC='docker-compose'; fi
            $DC exec -T web python manage.py shell -c "
            import json, os
            from django.contrib.auth import get_user_model

            User = get_user_model()
            demo = User.objects.filter(username='demo').first()
            env_user = os.getenv('KAYI_REVIEW_USERNAME') or ''
            env_pass = os.getenv('KAYI_REVIEW_PASSWORD') or ''
            configured = User.objects.filter(username=env_user).first() if env_user else None
            state = {
                'demo_exists': bool(demo),
                'demo_active': bool(demo and demo.is_active),
                'demo_has_usable_password': bool(demo and demo.has_usable_password()),
                'runtime_review_username_present': bool(env_user),
                'runtime_review_password_present': bool(env_pass),
                'runtime_review_user_exists': bool(configured),
                'runtime_review_user_active': bool(configured and configured.is_active),
                'runtime_password_matches_user': bool(configured and env_pass and configured.check_password(env_pass)),
            }
            print(json.dumps(state, sort_keys=True))
            "
