name: Native scanner CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Assemble application source
        run: bash scripts/unpack-source.sh
      - name: Audit account deletion, AI and mobile contracts
        run: |
          echo '=== Account deletion references ==='
          grep -RInE 'deletion|delete.account|account.delete|Konto.*löschen|Lösch|delete_request' erp config templates mobile tests 2>/dev/null | head -n 180 || true
          echo '=== AI / photo / voice endpoints and consent candidates ==='
          grep -RInE 'OpenAI|analyze_room_photos|AIPhoto|ai/chat|ai-report|voice|transcri|audio|measurements/analyze' erp config templates mobile tests 2>/dev/null | head -n 220 || true
          echo '=== Existing legal/privacy/support references ==='
          grep -RInE 'Datenschutz|Privacy|privacy|Impressum|Support|support' erp config templates mobile 2>/dev/null | head -n 160 || true
          echo '=== Android scanner source / API24 audit ==='
          SCANNER='native/plugins/kayi-room-scanner/android/src/main/java/de/kayihaustechnik/scanner/ArCoreRoomScanActivity.java'
          nl -ba "$SCANNER" | sed -n '1,190p'
          echo '=== Scanner API26 candidates ==='
          grep -nE 'java\.nio\.file|Files\.|Path\b|Paths\.|java\.time|Instant\.' "$SCANNER" || true
          echo '=== Native web/store assets ==='
          find native -maxdepth 4 -type f \( -iname '*.png' -o -iname '*.svg' -o -iname '*.webp' -o -iname '*.json' -o -iname '*.html' -o -iname '*.ts' \) | sort | head -n 220
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install and bundle native web application
        run: |
          python3 scripts/prepare_native_store_shell.py
          cd native
          npm install --no-audit --no-fund
          npm run build
          if grep -RInE "from[[:space:]]+['\"]@capacitor/core['\"]" www; then
            echo 'Native web bundle contains an unresolved @capacitor/core import' >&2
            exit 1
          fi
          if grep -RInE 'KAYI Haustechnik|Natives Baustellen-Aufmaß' www; then
            echo 'Native web bundle contains the rejected legacy splash' >&2
            exit 1
          fi
          grep -RIn 'A+Bau' www >/dev/null
      - name: Audit Capacitor release configuration
        working-directory: native
        run: |
          echo '=== package.json ==='
          cat package.json
          echo '=== capacitor config ==='
          for f in capacitor.config.*; do [ -f "$f" ] && { echo "--- $f"; cat "$f"; }; done
          echo '=== build script ==='
          cat scripts/build.mjs
      - name: Generate and synchronize Android project
        working-directory: native
        run: |
          npx cap add android
          npx cap sync android
          grep -F '"appName": "A+Bau"' android/app/src/main/assets/capacitor.config.json
          if grep -RInE "from[[:space:]]+['\"]@capacitor/core['\"]|KAYI Haustechnik|Natives Baustellen-Aufmaß" android/app/src/main/assets/public; then
            echo 'Generated Android assets are not startup-safe' >&2
            exit 1
          fi
      - name: Audit generated Android configuration
        working-directory: native
        run: |
          echo '=== Android Gradle identifiers / SDK levels ==='
          grep -RInE 'namespace|applicationId|compileSdk|targetSdk|minSdk|versionCode|versionName' android/app/build.gradle* android/variables.gradle android/build.gradle* || true
          echo '=== Android permissions ==='
          grep -RInE 'uses-permission|uses-feature' android/app/src/main/AndroidManifest.xml || true
      - name: Build Android debug APK
        working-directory: native/android
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: a-bau-native-startup-android-${{ github.run_id }}
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Assemble application source
        run: bash scripts/unpack-source.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install and bundle native web application
        run: |
          python3 scripts/prepare_native_store_shell.py
          cd native
          npm install --no-audit --no-fund
          npm run build
          if grep -RInE "from[[:space:]]+['\"]@capacitor/core['\"]" www; then
            echo 'Native web bundle contains an unresolved @capacitor/core import' >&2
            exit 1
          fi
          if grep -RInE 'KAYI Haustechnik|Natives Baustellen-Aufmaß' www; then
            echo 'Native web bundle contains the rejected legacy splash' >&2
            exit 1
          fi
      - name: Audit Xcode version and Capacitor release configuration
        working-directory: native
        run: |
          xcodebuild -version
          echo '=== package.json ==='
          cat package.json
          echo '=== capacitor config ==='
          for f in capacitor.config.*; do [ -f "$f" ] && { echo "--- $f"; cat "$f"; }; done
      - name: Generate and synchronize iOS project
        working-directory: native
        run: |
          npx cap add ios
          npx cap sync ios
          if grep -RInE "from[[:space:]]+['\"]@capacitor/core['\"]|KAYI Haustechnik|Natives Baustellen-Aufmaß" ios/App/App/public; then
            echo 'Generated iOS assets are not startup-safe' >&2
            exit 1
          fi
          sed -i '' 's/\.iOS(.v15)/.iOS(.v16)/g' ios/App/CapApp-SPM/Package.swift
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string A+Bau benötigt die Kamera für die präzise Raumvermessung." ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription A+Bau benötigt die Kamera für die präzise Raumvermessung." ios/App/App/Info.plist
      - name: Audit generated iOS configuration
        working-directory: native
        run: |
          echo '=== Bundle / deployment configuration ==='
          grep -nE 'PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION|IPHONEOS_DEPLOYMENT_TARGET' ios/App/App.xcodeproj/project.pbxproj || true
          echo '=== Info.plist ==='
          plutil -p ios/App/App/Info.plist || true
          echo '=== Privacy manifests ==='
          find ios -name 'PrivacyInfo.xcprivacy' -print || true
      - name: Compile iOS simulator application
        working-directory: native
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            build
