name: Import Kundenregister securely

on:
  push:
    branches:
      - ops/import-kundenregister-20260807

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Import encrypted customer register on production
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -eu
            BRANCH='ops/import-kundenregister-20260807'
            EXPECTED_PLAIN_SHA='30c4f56000765be1f864ad4ee07e2a1d382f39614b9ef4185ee377ffb7eb9863'
            EXPECTED_CIPHER_SHA='9e92c9730f90db2dc5a190fb2c49fb0997ae23941bd85c693971b2fbff903482'
            EXPECTED_KEY_SHA='5c40afc95e9df128ddd56fbddb4c306258deda8e229fc693537f98f1b15f6f03'
            TMP_ROOT="$(mktemp -d /tmp/kayi-kundenregister.XXXXXX)"
            cleanup_sensitive() {
              if command -v shred >/dev/null 2>&1; then
                find "$TMP_ROOT" -type f -exec shred -u {} \; 2>/dev/null || true
              fi
              rm -rf "$TMP_ROOT"
            }
            trap cleanup_sensitive EXIT INT TERM

            cd /opt/kayi
            git fetch origin "$BRANCH"
            : > "$TMP_ROOT/payload.b64"
            for part in 000 001 002 003; do
              git show "origin/$BRANCH:ops/kundenregister.payload.part-$part" >> "$TMP_ROOT/payload.b64"
            done
            test "$(wc -c < "$TMP_ROOT/payload.b64")" -eq 21036
            base64 --decode "$TMP_ROOT/payload.b64" > "$TMP_ROOT/kundenregister.enc"
            test "$(wc -c < "$TMP_ROOT/kundenregister.enc")" -eq 15776
            printf '%s  %s\n' "$EXPECTED_CIPHER_SHA" "$TMP_ROOT/kundenregister.enc" | sha256sum --check

            git show "origin/$BRANCH:ops/kundenregister.key.enc.b64" > "$TMP_ROOT/key.b64"
            test "$(wc -c < "$TMP_ROOT/key.b64")" -eq 512
            base64 --decode "$TMP_ROOT/key.b64" > "$TMP_ROOT/key.enc"
            test "$(wc -c < "$TMP_ROOT/key.enc")" -eq 384
            printf '%s  %s\n' "$EXPECTED_KEY_SHA" "$TMP_ROOT/key.enc" | sha256sum --check

            openssl pkeyutl -decrypt \
              -inkey /opt/kayi-secrets/reference-private.pem \
              -in "$TMP_ROOT/key.enc" \
              -out "$TMP_ROOT/passphrase" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in "$TMP_ROOT/kundenregister.enc" \
              -out "$TMP_ROOT/kundenregister.csv" \
              -pass file:"$TMP_ROOT/passphrase"
            printf '%s  %s\n' "$EXPECTED_PLAIN_SHA" "$TMP_ROOT/kundenregister.csv" | sha256sum --check

            if docker compose version >/dev/null 2>&1; then
              DC='docker compose'
            else
              DC='docker-compose'
            fi

            $DC run --rm \
              -v "$TMP_ROOT/kundenregister.csv:/import/kundenregister.csv:ro" \
              web python manage.py shell -c "from erp.models import Organization, Customer; from erp.services.importers import import_customers; org=Organization.objects.get(name='KAYI Haustechnik'); before=Customer.objects.filter(organization=org).count(); result=import_customers('/import/kundenregister.csv', org); after=Customer.objects.filter(organization=org).count(); tagged=Customer.objects.filter(organization=org, tags__contains=['Kundenregister']).count(); print('KUNDENREGISTER_IMPORT', result); print('CUSTOMER_COUNT_BEFORE', before); print('CUSTOMER_COUNT_AFTER', after); print('KUNDENREGISTER_TAGGED', tagged); assert not result['errors'], result['errors']; assert result['created'] + result['updated'] == 128, result; assert tagged >= 128, tagged"
