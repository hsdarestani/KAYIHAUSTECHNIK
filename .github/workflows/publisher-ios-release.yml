name: A+Bau Publisher iOS release

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: App Store version
        required: true
        default: '2.2.2'
      build_number:
        description: Monotonically increasing App Store build number
        required: true
        default: '22006'

permissions:
  contents: read

jobs:
  app-store-ipa:
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Require current App Store toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,v,"."); print v[1]}')"
          test "$MAJOR" -ge 26
          xcrun --sdk iphoneos --show-sdk-version | grep -E '^26(\.|$)'

      - name: Require Apple signing secrets
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_PROVISIONING_PROFILE_BASE64"
          test -n "$APPLE_TEAM_ID"

      - name: Install Apple distribution certificate and profile
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/a-bau-distribution.p12"
          PROFILE="$RUNNER_TEMP/a-bau.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/a-bau-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"

          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k actions "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          case "$APP_ID" in
            *de.kayihaustechnik.app) ;;
            *) echo "Provisioning profile does not match de.kayihaustechnik.app" >&2; exit 1 ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "IOS_PROVISIONING_PROFILE_SPECIFIER=$NAME" >> "$GITHUB_ENV"

      - name: Build signed IPA through existing Publisher build path
        env:
          APP_VERSION_NAME: ${{ inputs.app_version }}
          APP_BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CODE_SIGN_IDENTITY: Apple Distribution
        run: |
          set -euo pipefail
          bash scripts/publisher-build-ios.sh

      - name: Verify rejection fix and signed App Store payload
        env:
          EXPECTED_VERSION: ${{ inputs.app_version }}
          EXPECTED_BUILD: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          test -f artifacts/a-bau.ipa

          grep -Rqs 'Keine nicht hochgeladenen Scans vorhanden.' native/www
          grep -Rqs 'previousValues: enteredValues' native/plugins/kayi-room-scanner/ios/Sources/KayiRoomScannerPlugin/KayiRoomScannerPlugin.swift

          CHECK_DIR="$RUNNER_TEMP/a-bau-ipa-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q artifacts/a-bau.ipa -d "$CHECK_DIR"
          APP="$(find "$CHECK_DIR/Payload" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP" && test -d "$APP"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'de.kayihaustechnik.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$EXPECTED_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$EXPECTED_BUILD"
          codesign --verify --deep --strict "$APP"

      - name: Upload signed App Store IPA
        uses: actions/upload-artifact@v4
        with:
          name: A-Bau-App-Store-${{ inputs.app_version }}-${{ inputs.build_number }}
          path: artifacts/a-bau.ipa
          if-no-files-found: error
          retention-days: 30
