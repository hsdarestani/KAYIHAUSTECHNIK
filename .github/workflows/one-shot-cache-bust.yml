name: One-shot cache bust wiring

on:
  push:
    branches: [fix/static-cache-bust]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wire post-assembly cache bust and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          unpack = Path("scripts/unpack-source.sh")
          text = unpack.read_text(encoding="utf-8")
          marker = "python3 scripts/cache_bust_overrides.py"
          if marker not in text:
              needle = "python3 scripts/source_overrides.py\n"
              if needle not in text:
                  raise SystemExit("source override invocation not found")
              text = text.replace(needle, needle + marker + "\n", 1)
              unpack.write_text(text, encoding="utf-8")

          Path(".github/workflows/one-shot-cache-bust.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/unpack-source.sh .github/workflows/one-shot-cache-bust.yml
          git commit -m "Wire cache busting into source assembly"
          git push
