name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Verify and assemble source
        run: bash scripts/unpack-source.sh
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate test migrations
        run: python manage.py makemigrations erp --noinput
      - name: Migrate test database
        run: python manage.py migrate --noinput
      - name: Django checks
        run: python manage.py check
      - name: Tests
        run: python manage.py test -v 2
      - name: Python syntax
        run: python -m compileall -q config erp tests
      - name: Compose validation
        run: docker compose config --quiet
