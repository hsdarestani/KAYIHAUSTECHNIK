name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Verify repeatable source assembly
        run: |
          bash scripts/unpack-source.sh
          bash scripts/unpack-source.sh
      - name: Diagnose project wizard step markup
        run: |
          python - <<'PY'
          from pathlib import Path

          template = Path("templates/erp/project_wizard.html").read_text(encoding="utf-8").splitlines()
          js = Path("static/js/app.js").read_text(encoding="utf-8").splitlines()
          css = Path("static/css/app.css").read_text(encoding="utf-8").splitlines()

          print("=== TEMPLATE WIZARD MARKERS ===")
          template_needles = (
              "wizard-step", "data-step", "data-wizard", "Projektgrundlagen",
              "Welche Art von Projekt", "Auftragsart", "Passende Preisliste",
              "step-panel", "step-pane", "hidden",
          )
          for i, line in enumerate(template, 1):
              if any(needle in line for needle in template_needles):
                  print(f"{i}: {line}")

          print("=== TEMPLATE AROUND PROJEKTGRUNDLAGEN ===")
          for i, line in enumerate(template, 1):
              if "Projektgrundlagen" in line:
                  start = max(1, i - 25)
                  end = min(len(template), i + 80)
                  for n in range(start, end + 1):
                      print(f"{n}: {template[n-1]}")
                  break

          print("=== JS WIZARD MARKERS ===")
          js_needles = ("wizard", "data-step", "currentStep", "activeStep", "stepPanel", "step-panel", "step-pane")
          for i, line in enumerate(js, 1):
              if any(needle in line for needle in js_needles):
                  print(f"{i}: {line}")

          print("=== CSS WIZARD MARKERS ===")
          css_needles = ("wizard", "step-panel", "step-pane", "[hidden]")
          for i, line in enumerate(css, 1):
              if any(needle in line for needle in css_needles):
                  print(f"{i}: {line}")
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate committed migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate test database
        run: python manage.py migrate --noinput
      - name: Django checks
        run: python manage.py check
      - name: Tests
        run: python manage.py test -v 2
      - name: Python syntax
        run: python -m compileall -q config erp tests
      - name: Prepare Compose environment
        run: cp .env.example .env
      - name: Compose validation
        run: docker compose config --quiet
