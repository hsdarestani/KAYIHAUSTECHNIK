name: Deploy production after merged PR

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kayi-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAIAPIKEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Verify and assemble source
        run: bash scripts/unpack-source.sh

      - name: Validate assembled application
        run: |
          python3 -m compileall -q erp config tests scripts/production_browser_smoke.py
          node --check static/js/app.js
          cp .env.example .env
          docker compose config --quiet

      - name: Deploy app and authoritative price data over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASS }}
          envs: OPENAI_API_KEY
          command_timeout: 40m
          script: |
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v git >/dev/null 2>&1; then
              apt-get update
              apt-get install -y git
            fi
            mkdir -p /opt
            if [ ! -d /opt/kayi/.git ]; then
              rm -rf /opt/kayi
              git clone https://github.com/hsdarestani/KAYIHAUSTECHNIK.git /opt/kayi
            fi
            cd /opt/kayi
            git fetch origin main
            git reset --hard origin/main
            OPENAI_API_KEY="$OPENAI_API_KEY" sh deploy/server-deploy.sh

      - name: Audit effective B&O pricing coverage
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -eu
            cd /opt/kayi
            if docker compose version >/dev/null 2>&1; then DC='docker compose'; else DC='docker-compose'; fi
            $DC run --rm web python manage.py shell -c "
            from erp.models import CatalogItem, Organization
            from erp.services.effective_pricing import apply_effective_prices
            org = Organization.objects.filter(name='KAYI Haustechnik').first()
            assert org is not None, 'KAYI organization missing'
            items = list(CatalogItem.objects.filter(organization=org, active=True).order_by('code'))
            apply_effective_prices(org, items)
            missing = [item for item in items if getattr(item, 'effective_price_source_kind', '') == 'Fehlt']
            priced = len(items) - len(missing)
            print(f'B&O EFFECTIVE PRICE COVERAGE: {priced}/{len(items)} priced; {len(missing)} unresolved')
            for item in missing[:100]:
                print(f'B&O UNRESOLVED: {item.code} | {item.name}')
            "
