name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: kayi-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'issues' || (github.event.issue.user.login == 'hsdarestani' && github.event.issue.title == '[deploy] KAYI production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAIAPIKEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify and assemble source
        run: bash scripts/unpack-source.sh

      - name: Validate assembled application
        run: |
          python3 -m compileall -q erp config tests
          node --check static/js/app.js
          cp .env.example .env
          docker compose config --quiet

      - name: Deploy app and authoritative price data over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          envs: OPENAI_API_KEY
          command_timeout: 40m
          script: |
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v git >/dev/null 2>&1; then
              apt-get update
              apt-get install -y git
            fi
            mkdir -p /opt
            if [ ! -d /opt/kayi/.git ]; then
              rm -rf /opt/kayi
              git clone https://github.com/hsdarestani/KAYIHAUSTECHNIK.git /opt/kayi
            fi
            cd /opt/kayi
            git fetch origin main
            git reset --hard origin/main
            OPENAI_API_KEY="$OPENAI_API_KEY" sh deploy/server-deploy.sh
