name: Wire AI resilience patch

on:
  push:
    branches:
      - fix/ai-photo-production-20260807

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ai-photo-production-20260807
          fetch-depth: 0
      - name: Add verified patch to source assembly
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/source_overrides.py')
          text = path.read_text(encoding='utf-8')
          marker = 'scripts/ai_provider_resilience_patch'
          if marker not in text:
              anchor = '# Android does not expose Java 11\'s Files.readString/writeString helpers.'
              block = '''apply_verified_patch(
              "scripts/ai_provider_resilience_patch",
              "67763375707daa486b66c6934a02ac30476ff109686d52adb453bf69d11dc1cb",
              "kayi-ai-provider-resilience.patch",
              "KAYI AI provider resilience",
          )

          '''
              if anchor not in text:
                  raise SystemExit('source assembly anchor not found')
              text = text.replace(anchor, block + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet; then
            echo 'Already wired.'
            exit 0
          fi
          git config user.name 'KAYI CI'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/source_overrides.py
          git commit -m 'Wire AI provider resilience patch'
          git push origin HEAD:fix/ai-photo-production-20260807
