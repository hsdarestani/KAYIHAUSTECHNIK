name: Production AI vision smoke

on:
  push:
    branches:
      - ops/ai-vision-smoke-20260807

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Exercise production photo-analysis AI path
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -eu
            cd /opt/kayi
            if docker compose version >/dev/null 2>&1; then DC='docker compose'; else DC='docker-compose'; fi
            $DC exec -T web python manage.py shell -c "import base64; from django.core.files.uploadedfile import SimpleUploadedFile; from django.conf import settings; from erp.services.ai import analyze_room_photos; raw=base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAXklEQVR4nO3PMQ0AMAzAsPInvYLYYVWKESTzjhsd8KsBrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BbQHKU9LC7/CP1AAAAABJRU5ErkJggg=='); f=SimpleUploadedFile('smoke.png',raw,content_type='image/png'); print('EFFECTIVE_MODEL',settings.OPENAI_MODEL); result=analyze_room_photos([f],{}); print('VISION_SMOKE_METHOD',result.get('method')); print('VISION_SMOKE_CONFIDENCE',result.get('confidence')); assert result.get('method') in {'reference_photo','ar_lidar','visual_only','insufficient'}"
