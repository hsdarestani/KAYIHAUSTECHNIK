name: Commit generated ERP migration

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  commit-migration:
    if: ${{ github.actor != 'github-actions[bot]' && github.event.pull_request.user.login == 'hsdarestani' && github.event.pull_request.title == '[migration-sync] Commit ERP migration' && github.event.pull_request.base.ref == 'main' && github.head_ref == 'release/erp-initial-migration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify and assemble source
        run: bash scripts/unpack-source.sh
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate migration
        run: python manage.py makemigrations erp --noinput
      - name: Commit migration
        run: |
          test -f erp/migrations/0001_initial.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add erp/migrations/0001_initial.py
          git commit -m "Commit initial ERP database migration"
          git push origin HEAD:${GITHUB_HEAD_REF}
