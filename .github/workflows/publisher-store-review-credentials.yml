name: Provision A+Bau Store Review Credentials

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SYNC_STABLE_REVIEW_CREDENTIALS. This syncs the fixed reviewer password; it does not rotate it.'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/publisher-store-review-credentials.yml'

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    env:
      REVIEW_USER: demo
      REVIEW_PASS: ${{ secrets.KAYI_REVIEW_PASSWORD }}
    steps:
      - name: Require stable reviewer password
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            test "$CONFIRMATION" = 'SYNC_STABLE_REVIEW_CREDENTIALS' || {
              echo 'Refusing to change Store review state without explicit confirmation.' >&2
              exit 2
            }
          fi
          test -n "$REVIEW_PASS" || { echo 'KAYI_REVIEW_PASSWORD is missing.' >&2; exit 2; }
          echo "::add-mask::$REVIEW_PASS"
          echo 'Stable review account demo is configured. Password will not be printed or rotated.'

      - name: Wait for secure Publisher credential endpoint
        run: |
          set -euo pipefail
          URL='https://publisher.smarbiz.sbs/apps/agent-api/a-bau-review-credentials/'
          for i in $(seq 1 60); do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$URL" || true)"
            if [ "$CODE" = '405' ] || [ "$CODE" = '401' ]; then
              echo 'Publisher review credential bridge is ready.'
              exit 0
            fi
            sleep 5
          done
          echo 'Publisher review credential bridge did not become ready.' >&2
          exit 2

      - name: Create GitHub OIDC assertion
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fpublisher.smarbiz.sbs")"
          OIDC_TOKEN="$(OIDC_JSON="$OIDC_JSON" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ['OIDC_JSON'])['value'])
          PY
          )"
          echo "::add-mask::$OIDC_TOKEN"
          echo "OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Sync and verify isolated A+Bau reviewer on production
        uses: appleboy/ssh-action@v1.2.5
        env:
          REVIEW_USER: demo
          REVIEW_PASS: ${{ secrets.KAYI_REVIEW_PASSWORD }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASS }}
          envs: REVIEW_USER,REVIEW_PASS
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/kayi
            if docker compose version >/dev/null 2>&1; then DC='docker compose'; else DC='docker-compose'; fi
            $DC exec -T \
              -e REVIEW_USER="$REVIEW_USER" \
              -e REVIEW_PASS="$REVIEW_PASS" \
              web python manage.py shell -c "
            import os
            from django.contrib.auth import authenticate, get_user_model

            username = os.environ['REVIEW_USER']
            password = os.environ['REVIEW_PASS']
            User = get_user_model()
            user = User.objects.filter(username=username).first()
            assert user is not None, 'isolated Store review account missing'
            user.set_password(password)
            user.is_active = True
            user.save(update_fields=['password', 'is_active'])
            user.refresh_from_db()
            assert user.check_password(password), 'Store review password verification failed'
            assert authenticate(username=username, password=password) is not None, 'Store review authentication failed'
            print('A+Bau Store review account synchronized and authentication verified.')
            "

      - name: Store the same stable credential encrypted in Publisher
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(REVIEW_USER="$REVIEW_USER" REVIEW_PASS="$REVIEW_PASS" python3 - <<'PY'
          import json, os
          print(json.dumps({
              'bundle_id': 'de.kayihaustechnik.app',
              'username': os.environ['REVIEW_USER'],
              'password': os.environ['REVIEW_PASS'],
          }))
          PY
          )"
          RESPONSE="$(curl -fsS \
            -H "X-GitHub-OIDC: $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "$PAYLOAD" \
            'https://publisher.smarbiz.sbs/apps/agent-api/a-bau-review-credentials/')"
          RESPONSE="$RESPONSE" REVIEW_USER="$REVIEW_USER" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RESPONSE'])
          assert data.get('ok') is True, data
          assert data.get('review_username') == os.environ['REVIEW_USER'], data
          print(f"Publisher review credential synchronized for app_id={data.get('app_id')}; username={data.get('review_username')}")
          PY

      - name: Play Console synchronization reminder
        run: |
          echo 'IMPORTANT: Google Play Console > App content > App access must use username demo and the SAME KAYI_REVIEW_PASSWORD.'
          echo 'Do not rotate the production reviewer password while a Store review is in progress.'
