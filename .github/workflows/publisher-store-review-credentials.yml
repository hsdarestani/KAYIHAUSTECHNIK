name: Provision A+Bau Store Review Credentials

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ROTATE_AND_UPDATE_BOTH_STORES; rotation invalidates existing Apple and Google reviewer passwords.'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require coordinated Apple and Google metadata update
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'ROTATE_AND_UPDATE_BOTH_STORES' || {
            echo 'Refusing to rotate review credentials without coordinated Apple and Google store updates.' >&2
            exit 2
          }

      - name: Wait for secure Publisher credential endpoint
        run: |
          set -euo pipefail
          URL='https://publisher.smarbiz.sbs/apps/agent-api/a-bau-review-credentials/'
          for i in $(seq 1 60); do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$URL" || true)"
            if [ "$CODE" = '405' ] || [ "$CODE" = '401' ]; then
              echo 'Publisher review credential bridge is ready.'
              exit 0
            fi
            sleep 5
          done
          echo 'Publisher review credential bridge did not become ready.' >&2
          exit 2

      - name: Generate one-time review password and GitHub OIDC assertion
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$REVIEW_PASS"
          OIDC_JSON="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fpublisher.smarbiz.sbs")"
          OIDC_TOKEN="$(OIDC_JSON="$OIDC_JSON" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ['OIDC_JSON'])['value'])
          PY
          )"
          echo "::add-mask::$OIDC_TOKEN"
          {
            echo "REVIEW_PASS=$REVIEW_PASS"
            echo "OIDC_TOKEN=$OIDC_TOKEN"
          } >> "$GITHUB_ENV"

      - name: Rotate isolated A+Bau demo password on production
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASS }}
          envs: REVIEW_PASS
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/kayi
            if docker compose version >/dev/null 2>&1; then DC='docker compose'; else DC='docker-compose'; fi
            $DC exec -T -e REVIEW_PASS="$REVIEW_PASS" web python manage.py shell -c "
            import os
            from django.contrib.auth import get_user_model
            User = get_user_model()
            user = User.objects.filter(username='demo').first()
            assert user is not None, 'isolated demo account missing'
            user.set_password(os.environ['REVIEW_PASS'])
            user.is_active = True
            user.save(update_fields=['password', 'is_active'])
            print('A+Bau isolated Store review account rotated successfully.')
            "

      - name: Store review credential encrypted in Publisher
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(REVIEW_PASS="$REVIEW_PASS" python3 - <<'PY'
          import json, os
          print(json.dumps({
              'bundle_id': 'de.kayihaustechnik.app',
              'username': 'demo',
              'password': os.environ['REVIEW_PASS'],
          }))
          PY
          )"
          RESPONSE="$(curl -fsS \
            -H "X-GitHub-OIDC: $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "$PAYLOAD" \
            'https://publisher.smarbiz.sbs/apps/agent-api/a-bau-review-credentials/')"
          RESPONSE="$RESPONSE" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RESPONSE'])
          assert data.get('ok') is True, data
          assert data.get('review_username') == 'demo', data
          print(f"Publisher review credentials ready for app_id={data.get('app_id')}; username=demo")
          PY
