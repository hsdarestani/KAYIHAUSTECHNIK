name: Inspect assembled source

on:
  push:
    branches:
      - fix/angebot-pdf-prices-3d

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble application source
        run: bash scripts/unpack-source.sh
      - name: Pack relevant assembled source
        run: |
          tar -czf /tmp/kayi-assembled-source.tgz \
            erp templates tests static/js static/css config \
            requirements.txt manage.py
      - uses: actions/upload-artifact@v4
        with:
          name: kayi-assembled-source
          path: /tmp/kayi-assembled-source.tgz
          if-no-files-found: error
          retention-days: 1
