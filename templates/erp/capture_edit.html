{% extends 'erp/base.html' %}
{% block page_title %}Aufmaßfoto markieren{% endblock %}{% block content %}<form method="post" data-annotation-editor>{% csrf_token %}<div class="annotation-layout"><div class="annotation-canvas-wrap"><img id="annotationImage" src="{{ capture.image.url }}"><canvas id="annotationCanvas"></canvas></div><aside class="panel"><h2>{{ capture.get_kind_display }}</h2><button type="button" class="btn btn-secondary" data-annotation-mode="draw">Zeichnen</button><button type="button" class="btn btn-secondary" data-annotation-mode="text">Text</button><button type="button" class="btn btn-secondary" data-annotation-clear>Löschen</button><input type="hidden" name="annotations" id="annotationsData" value="{{ annotations_json|escape }}"><button class="btn btn-primary">Speichern</button></aside></div></form>{% endblock %}
