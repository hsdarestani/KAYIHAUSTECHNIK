<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kundenfeedback</title><style>body{font-family:Arial;background:#f3f6fb;color:#10213b}.card{max-width:680px;margin:40px auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 20px 60px #0b1f3a20}label{display:block;margin:18px 0}textarea{width:100%;min-height:120px}button{background:#1769e0;color:#fff;border:0;border-radius:10px;padding:14px 22px;font-weight:bold}ul{display:flex;gap:14px;list-style:none;padding:0}</style></head><body><main class="card"><h1>Wie zufrieden waren Sie?</h1><p>{{ survey.project.title }} · {{ survey.organization.name }}</p>{% if thanks %}<h2>Vielen Dank für Ihr Feedback.</h2>{% else %}<form method="post">{% csrf_token %}{{ form.as_p }}<button>Feedback senden</button></form>{% endif %}</main></body></html>
